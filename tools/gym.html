<title>Libreta del Entrenador</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gym">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de una columna pensada para iPhone; barra de pestañas fija abajo, tarjetas grandes y tocables. */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --surface-2:#e8ecf2; --fg:#121821; --muted:#5a6575; --line:#d5dbe4;
  --accent:#2343d0; --accent-fg:#ffffff; --accent-soft:#e2e7fd;
  --warn:#a35206; --warn-soft:#fcefd9; --ok:#13744a; --ok-soft:#dcf2e6; --danger:#b42318; --danger-soft:#fde5e2;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px; --tab-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1218; --surface:#161b24; --surface-2:#1f2531; --fg:#e8ecf3; --muted:#9aa4b4; --line:#2a3240;
  --accent:#8096ff; --accent-fg:#0b1020; --accent-soft:#1e2752;
  --warn:#f0b45a; --warn-soft:#3a2a12; --ok:#5ccb94; --ok-soft:#133325; --danger:#f2806f; --danger-soft:#3d1a16; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1218; --surface:#161b24; --surface-2:#1f2531; --fg:#e8ecf3; --muted:#9aa4b4; --line:#2a3240;
  --accent:#8096ff; --accent-fg:#0b1020; --accent-soft:#1e2752;
  --warn:#f0b45a; --warn-soft:#3a2a12; --ok:#5ccb94; --ok-soft:#133325; --danger:#f2806f; --danger-soft:#3d1a16; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
main{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px calc(var(--tab-h) + 32px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.1}
h1{font-size:2.1rem}
h2{font-size:1.45rem}
h3{font-size:1.2rem}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.section{display:flex;flex-direction:column;gap:12px;margin-top:28px}
.label{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* Botones grandes */
button{font:inherit;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);font-weight:600;font-size:1rem;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn-big{min-height:58px;font-size:1.1rem;width:100%}
.btn-danger{color:var(--danger);border-color:var(--danger)}
.btn-danger.armed{background:var(--danger);color:var(--surface)}
.btn-ghost{border-color:transparent;background:transparent;color:var(--accent);padding:0 8px}
.btn:focus-visible,.card:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.tab:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
svg.i{width:22px;height:22px;flex:none}

/* Tarjetas */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px;text-align:left;color:var(--fg);width:100%}
button.card{min-height:72px}
button.card:active{background:var(--surface-2)}
.list{display:flex;flex-direction:column;gap:10px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.85rem;font-weight:600;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.att-more{display:flex;flex-direction:column;gap:8px;padding:10px 4px 6px}
.scores{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scores button{min-height:46px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);font:inherit;font-weight:700;font-size:1.05rem;cursor:pointer}
.scores button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.wstat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wstat div{display:flex;flex-direction:column;gap:2px}
.wstat b{font-size:1.5rem}
.boards.one{grid-template-columns:1fr}
.boards.one button{aspect-ratio:auto;height:170px}
.linkbtn{background:none;border:0;color:var(--accent);font:inherit;font-weight:600;font-size:.95rem;padding:10px;cursor:pointer;text-align:center;align-self:center}
.boards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.boards button{padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;aspect-ratio:1;background:var(--surface-2);cursor:pointer}
.boards img{width:100%;height:100%;object-fit:cover;display:block}
.day .cam{font-size:.6rem;line-height:1}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.avatar{overflow:hidden;width:46px;height:46px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:1.2rem;flex:none}
.cli{flex-direction:row;align-items:center;gap:14px}
.cli .txt{min-width:0;flex:1;display:flex;flex-direction:column;gap:4px}
.cli .name{font-weight:700;font-size:1.08rem}
.ellip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 12px}
.stat b{display:block;font-family:var(--f-display);font-size:2rem;line-height:1}
.stat span{font-size:.85rem;color:var(--muted)}

.hero{display:flex;flex-direction:column;gap:6px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.ex-line{font-size:.95rem;color:var(--muted)}
.ex-line b{color:var(--fg);font-weight:600}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:22px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.banner{background:var(--warn-soft);color:var(--warn);padding:12px 14px;border-radius:12px;font-weight:500}
.chart{width:100%;height:auto;display:block}
.seg{flex:none;display:flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px;overflow-x:auto}
.seg button{flex:1;min-height:42px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-weight:600;white-space:nowrap;padding:0 12px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-weight:600;background:none;border:0;padding:8px 0;min-height:44px;font-size:1rem}

/* Barra inferior */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs[hidden]{display:none}
nav.tabs .in{display:flex;width:100%;max-width:760px}
.tab{flex:1;height:var(--tab-h);border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.82rem;font-weight:600}
.tab[aria-current="page"]{color:var(--accent)}
.tab svg{width:26px;height:26px}

/* Formularios (hoja que sube desde abajo) */
.sheet-bg{position:fixed;inset:0;background:rgba(10,14,20,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:94%;border-radius:20px 20px 0 0;display:flex;flex-direction:column;overflow:hidden}
.sheet header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--surface)}
.sheet .body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-weight:600;font-size:.95rem}
.field>small{color:var(--muted)}
input,select,textarea{font:inherit;font-size:17px;width:100%;min-height:50px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg)}
textarea{min-height:90px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.exrow{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px}
.exrow .mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.exrow .mini label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted);font-weight:600;min-width:0}
.exrow .mini input{text-align:center;padding:8px 4px}
.rpe{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.rpe button{min-height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);font-weight:700}
.rpe button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab-h) + 16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;z-index:60;max-width:90%}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{text-align:center;font-size:.78rem;font-weight:600;color:var(--muted);padding:4px 0;text-transform:uppercase;letter-spacing:.05em}
.day{aspect-ratio:1/1.1;max-width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:4px;padding:6px 0 0;color:var(--fg);font-weight:600;font-size:1rem;min-width:0}
.day.past{background:var(--surface-2);border-color:transparent}
.day.today{border:2px solid var(--accent);color:var(--accent)}
.day.blank{visibility:hidden}
.dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;padding:0 2px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.dot.plan{background:transparent;border:2px solid var(--accent)}
.dot.miss{background:transparent;border:2px solid var(--warn)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.88rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.monthbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.monthbar .btn{min-width:50px;padding:0}
.pickp[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.pickp .tick{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;color:var(--accent-fg);flex:none}
.pickp[aria-pressed="true"] .tick{background:var(--accent);border-color:var(--accent)}
.help{background:var(--accent-soft);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
@media (max-width:420px){h1{font-size:1.85rem}.stat b{font-size:1.7rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<main id="app"><p class="muted">Cargando…</p></main>
<nav class="tabs" aria-label="Secciones"><div class="in" id="tabs"></div></nav>
<div id="sheet"></div>
<div id="picker"></div>
<div id="confirm"></div>
<div id="toast" class="toast" hidden></div>

<script>
const ICON={
  home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.3-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.6"/><path d="M16.5 14.6c2.6.2 4.4 1.9 5 4.9"/>',
  list:'<path d="M5 6h14M5 12h14M5 18h9"/><circle cx="19" cy="18" r="0"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  back:'<path d="M15 5l-7 7 7 7"/>',
  close:'<path d="M6 6l12 12M18 6L6 18"/>',
  dumbbell:'<path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/>',
  cal:'<rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
  edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>'
};
const ic=(n,cls='i')=>`<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]}</svg>`;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const dt=s=>new Date(s+'T12:00:00');
const fmtDate=(s,opt)=>s?dt(s).toLocaleDateString('es-ES',opt||{day:'numeric',month:'short',year:'numeric'}):'—';
const daysSince=s=>Math.round((dt(today())-dt(s))/86400000);
const ago=s=>{if(!s)return 'Nunca';const d=daysSince(s);return d<=0?'Hoy':d===1?'Ayer':`Hace ${d} días`};
const avatar=(c,size)=>`<span class="avatar"${size?` style="width:${size}px;height:${size}px;font-size:${size/38}rem"`:''}>${c&&c.photo&&/^data:image\/(jpeg|png|webp);base64,/.test(c.photo)?`<img src="${c.photo}" alt="">`:esc(initials(c&&c.name))}</span>`;
const initials=n=>(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const num=v=>{if(v===''||v==null)return null;const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?null:n};
const age=b=>{if(!b)return null;const n=new Date(),d=new Date(b);let a=n.getFullYear()-d.getFullYear();if(n<new Date(n.getFullYear(),d.getMonth(),d.getDate()))a--;return a};

const DEFAULT_TYPES=['AMRAP','EMOM','For time','Por series','Tabata','Circuito'];
const WORDS={Clientes:'cliente',Alumnos:'alumno',Socios:'socio',Atletas:'atleta',Deportistas:'deportista'};
let CFG=null, cfgLoaded=false, wiz=null;
const TYPES_=()=>[...new Set([...DEFAULT_TYPES,...((CFG&&CFG.customTypes)||[])])];
const blocksOf=r=>(r&&r.blocks&&r.blocks.length)?r.blocks:[{type:(r&&r.type)||'',mins:''}];
const typeLabel=bl=>bl.filter(b=>b.type).map(b=>b.type+(b.mins?` ${b.mins}'`:'')).join(' + ');
const WP=()=>(CFG&&CFG.wordP)||'Clientes';
const wp=()=>WP().toLowerCase();
const ws=()=>(CFG&&CFG.wordS)||'cliente';
const WS=()=>ws().charAt(0).toUpperCase()+ws().slice(1);
const LEVELS=['Principiante','Intermedio','Avanzado'];
const COLS=['routines','clients','sessions','measures','plans','exercises','boards','days'];
const S={routines:[],clients:[],sessions:[],measures:[],plans:[],exercises:[],boards:[],days:[]};
const got={}; let db=null, status='loading', slow=false, readOnly=false;
let clientTab='sesiones', progEx=null, search='', calClient='', cFilter='';
const SHIFTS=[['manana','Mañana'],['tarde','Tarde']];
const shiftName=v=>v==='ambos'?'Mañana y tarde':(SHIFTS.find(x=>x[0]===v)||[])[1]||'';
const inShift=(c,f)=>!f||c.shift===f||c.shift==='ambos';
const segFilter=(act,cur)=>`<div class="seg" role="group" aria-label="Filtrar por horario">${[['','Todos'],...SHIFTS].map(([v,l])=>`<button type="button" data-act="${act}" data-id="${v}" aria-pressed="${cur===v}">${l}</button>`).join('')}</div>`;
const clientsFiltered=()=>S.clients.filter(c=>(!search||c.name.toLowerCase().includes(search.toLowerCase()))&&inShift(c,cFilter)).sort((a,b)=>(a.active===false)-(b.active===false)||a.name.localeCompare(b.name,'es'));
let calMonth=(()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),1)})();
const iso=d=>{const x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,10)};
const plansOn=(date)=>S.plans.filter(p=>p.date===date).sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'));
const sessionsOn=(date)=>S.sessions.filter(x=>x.date===date);
const GROUPS=[['','Todos'],['manana','Mañana'],['tarde','Tarde']];
const groupName=v=>v==='manana'?'Grupo de mañana':v==='tarde'?'Grupo de tarde':'';
/* clases de un día: sesiones agrupadas por plan o por rutina */
function classesOn(date,legacy){
  const m=new Map();
  sessionsOn(date).filter(x=>!legacy||!x.shift).forEach(x=>{const k=x.planId||('r:'+(x.routineId||x.routineName||''));if(!m.has(k))m.set(k,{key:k,planId:x.planId,routineName:x.routineName||'Sesión libre',list:[]});m.get(k).list.push(x)});
  return [...m.values()];
}

/* ---------- datos ---------- */
const byId=(k,id)=>S[k].find(x=>x.id===id);
const sessionsOf=id=>S.sessions.filter(s=>s.clientId===id).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.createdAt||0)-(a.createdAt||0));
const measuresOf=id=>S.measures.filter(m=>m.clientId===id).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
const lastSession=id=>sessionsOf(id)[0];

async function save(col,id,data){
  if(!db){toast('No hay conexión con el almacenamiento');return false}
  try{await db.doc(col+'/'+id).set(data);return true}
  catch(e){
    if(e&&e.code==='invalid_argument'){readOnly=true;toast('No tienes permiso para guardar cambios')}
    else if(e&&e.code==='quota_exceeded')toast('El almacenamiento está lleno. Borra datos antiguos.');
    else toast('No se pudo guardar. Revisa la conexión e inténtalo otra vez.');
    return false}
}
async function remove(col,id){try{await db.doc(col+'/'+id).delete();return true}catch(e){toast('No se pudo borrar. Inténtalo otra vez.');return false}}

async function init(){
  render();
  const c=window.claude;
  const t=setTimeout(()=>{slow=true;render()},10000);
  db=c?await c.use('db'):null;
  initSample();
  if(!db){clearTimeout(t);status='nodb';render();return}
  db.doc('settings/main').onSnapshot(snap=>{CFG=snap.exists?snap.data():null;cfgLoaded=true;schedule()},()=>{cfgLoaded=true;schedule()});
  COLS.forEach(k=>{
    db.collection(k).onSnapshot(snap=>{
      S[k]=snap.docs.map(d=>({...d.data(),id:d.id}));
      got[k]=true;
      if(COLS.every(x=>got[x])){status='ready';if(k==='clients'||k==='measures')setTimeout(migrateWeights,0); if(!snap.metadata.fromCache){clearTimeout(t);slow=false}}
      schedule();
    },err=>{clearTimeout(t);status='error';render()});
  });
}
let raf=0;const schedule=()=>{if(!raf)raf=requestAnimationFrame(()=>{raf=0;render()})};

/* ---------- navegación ---------- */
function route(){const h=location.hash.slice(1);if(h.startsWith('cliente-'))return{v:'cliente',id:h.slice(8)};if(h==='clientes'||h==='rutinas'||h==='calendario')return{v:h};return{v:'inicio'}}
function go(h){if(location.hash.slice(1)===h)render();else location.hash=h;window.scrollTo(0,0)}
addEventListener('hashchange',()=>{clientTab='sesiones';progEx=null;render();window.scrollTo(0,0)});

function renderTabs(){
  const r=route().v==='cliente'?'clientes':route().v;
  const t=[['inicio','Inicio','home'],['calendario','Calendario','cal'],['clientes',WP(),'users'],['rutinas','Rutinas','dumbbell']];
  document.getElementById('tabs').innerHTML=t.map(([h,l,i])=>`<button class="tab" data-go="${h}" ${r===h?'aria-current="page"':''}>${ic(i)}<span>${l}</span></button>`).join('');
}

/* ---------- vistas ---------- */
function render(){
  renderTabs();
  const app=document.getElementById('app');
  if(status==='nodb'){app.innerHTML=`<div class="empty"><h2>No se pueden abrir los datos</h2><p>Abre esta página desde claude.ai con tu cuenta iniciada.</p></div>`;return}
  if(status==='error'){app.innerHTML=`<div class="empty"><h2>Se perdió la conexión</h2><p>Recarga la página para volver a intentarlo.</p></div>`;return}
  if(status==='ready'&&!cfgLoaded){app.innerHTML='<p class="muted">Cargando tus datos…</p>';return}
  if(status==='ready'&&cfgLoaded&&!(CFG&&CFG.setupDone)&&!wiz)wiz={step:0,d:{types:[...DEFAULT_TYPES],wordP:'Clientes',sample:true}};
  if(wiz&&status!=='nodb'){document.querySelector('nav.tabs').hidden=true;app.innerHTML=vWizard();return}
  document.querySelector('nav.tabs').hidden=false;
  if(status==='loading'){app.innerHTML=`<p class="muted">Cargando tus datos…</p>${slow?'<p class="banner">Los datos tardan en llegar. Revisa la conexión.</p>':''}`;return}
  const r=route();
  const banner=slow?'<p class="banner">Puede que los datos no estén al día. Revisa la conexión.</p>':'';
  app.innerHTML=banner+(r.v==='clientes'?vClients():r.v==='rutinas'?vRoutines():r.v==='cliente'?vClient(r.id):r.v==='calendario'?vCalendar():vHome());
  if(r.v==='cliente'&&clientTab==='progreso')drawProgress(r.id);
}

      ${custom?`<input id="w-wordp" value="${esc(d.wordP)}" placeholder="En plural, ej.: Pupilos" autocomplete="off">`:''}`}
  if(st===3){
    if(edit){q='Listo';hint='Pulsa Guardar para aplicar los cambios.';body=''}
    else{q='¿Quieres que te preparemos unas rutinas de ejemplo?';hint='Te servirán de punto de partida. Luego puedes cambiarlas o borrarlas.';
    body=`<div class="list"><button type="button" class="btn btn-big btn-primary" data-act="w-sample" data-id="1">Sí, créalas</button><button type="button" class="btn btn-big" data-act="w-sample" data-id="0">No, empiezo de cero</button></div>`}}
  const last=st===WIZ_STEPS-1;
  return `<div class="stack" style="gap:22px;min-height:70vh;justify-content:center;padding-top:12px">
    ${dots}<p class="label" style="text-align:center">Paso ${st+1} de ${WIZ_STEPS}</p>
    <h1 style="font-size:1.9rem">${q}</h1><p class="muted">${hint}</p>${body}
    <div class="stack" style="margin-top:8px">${last&&!edit?'':`<button type="button" class="btn btn-primary btn-big" data-act="w-next">`}${last&&!edit?'':`${last?'Guardar':'Siguiente'}</button>`}

}

function vCalendar(){
  const y=calMonth.getFullYear(),m=calMonth.getMonth();
  const first=(new Date(y,m,1).getDay()+6)%7, days=new Date(y,m+1,0).getDate(), t=today();
  let cells='';for(let i=0;i<first;i++)cells+='<span class="day blank"></span>';
  for(let d=1;d<=days;d++){
    const ds=iso(new Date(y,m,d)),cs=classesOn(ds),ps=plansOn(ds).filter(p=>!S.sessions.some(s=>s.planId===p.id));
    const dots=cs.slice(0,4).map(()=>'<i class="dot"></i>').join('')+ps.slice(0,4).map(()=>`<i class="dot ${ds<t?'miss':'plan'}"></i>`).join('');
    cells+=`<button class="day ${ds<t?'past':''} ${ds===t?'today':''}" data-act="open-day" data-id="${ds}" aria-label="${esc(fmtDate(ds,{day:'numeric',month:'long'}))}"><span class="num">${d}</span><span class="dots">${dots}${boardsOn(ds).length?'<span class="cam" aria-label="Foto de la pizarra">📷</span>':''}</span></button>`;
  }
  const mName=(m=>m.charAt(0).toUpperCase()+m.slice(1))(calMonth.toLocaleDateString('es-ES',{month:'long'}))+' '+y;
  return `<h1>Calendario</h1><p class="muted" style="margin-top:6px">Toca un día: si ya pasó verás qué clases se hicieron; si aún no ha llegado podrás planificar qué entrenamiento toca.</p>
  <div class="section">
    <div class="monthbar"><button class="btn" data-act="cal-prev" aria-label="Mes anterior">${ic('back')}</button><h2>${esc(mName)}</h2><button class="btn" data-act="cal-next" aria-label="Mes siguiente" style="transform:scaleX(-1)">${ic('back')}</button></div>
    <div class="cal">${['L','M','X','J','V','S','D'].map(d=>`<span class="dow">${d}</span>`).join('')}${cells}</div>
    <div class="legend"><span><i class="dot"></i>Clase hecha</span><span><i class="dot plan"></i>Planificada</span><span><i class="dot miss"></i>Planificada sin apuntar</span></div>

/* ---------- progreso ---------- */
const norm=s=>(s||'').trim().toLowerCase();
function exerciseNames(id){
  const m=new Map();
  sessionsOf(id).forEach(s=>(s.exercises||[]).forEach(e=>{if(e.name&&num(e.weight)!=null&&!m.has(norm(e.name)))m.set(norm(e.name),e.name.trim())}));
  return [...m.values()];
}
function seriesFor(id,name){
  const pts={};
  sessionsOf(id).forEach(s=>(s.exercises||[]).forEach(e=>{const w=num(e.weight);if(norm(e.name)===norm(name)&&w!=null&&s.date)pts[s.date]=Math.max(pts[s.date]??-Infinity,w)}));
  return Object.entries(pts).map(([x,y])=>({x,y})).sort((a,b)=>a.x.localeCompare(b.x));
}
function drawProgress(id){
  const el=document.getElementById('progchart');if(!el||!progEx)return;
  const pts=seriesFor(id,progEx);
  if(pts.length<2){el.innerHTML=`<span class="label">${esc(progEx)}</span><p class="muted">Solo hay un registro (${pts[0]?pts[0].y+' kg':''}). Con dos o más verás la gráfica.</p>`;return}
  const diff=pts[pts.length-1].y-pts[0].y;
  el.innerHTML=`<span class="row between"><span class="label">${esc(progEx)} · peso máximo (kg)</span><span class="chip ${diff>0?'ok':''}">${diff>0?'+':''}${+diff.toFixed(1)} kg</span></span>${lineChart(pts,'kg')}`;
}
function prTable(id){
  return exerciseNames(id).map(n=>{const p=seriesFor(id,n);const best=p.reduce((a,b)=>b.y>=a.y?b:a);return `<div class="row between" style="padding:6px 0;border-bottom:1px solid var(--line)"><span>${esc(n)}</span><span class="num"><b>${best.y} kg</b> <span class="small muted">${esc(fmtDate(best.x,{day:'numeric',month:'short'}))}</span></span></div>`}).join('');
}
function lineChart(pts,unit,goal){
  if(goal==null||isNaN(+goal))goal=null;else goal=+goal;
  const W=400,H=230,L=40,R=14,T=24,B=30;
  const xs=pts.map(p=>dt(p.x).getTime()),ys=pts.map(p=>p.y);
  let x0=Math.min(...xs),x1=Math.max(...xs);if(x0===x1){x0-=864e5;x1+=864e5}
  let lo=Math.min(...ys,...(goal!=null?[goal]:[])),hi=Math.max(...ys,...(goal!=null?[goal]:[]));const pad=Math.max((hi-lo)*.15,1);lo=Math.floor(lo-pad);hi=Math.ceil(hi+pad);
  const step=niceStep((hi-lo)/4);lo=Math.floor(lo/step)*step;hi=Math.ceil(hi/step)*step;
  const sx=x=>L+(x-x0)/(x1-x0)*(W-L-R), sy=y=>T+(hi-y)/(hi-lo)*(H-T-B);
  let g='';for(let v=lo;v<=hi+1e-9;v+=step){g+=`<line x1="${L}" x2="${W-R}" y1="${sy(v)}" y2="${sy(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${sy(v)+4}" text-anchor="end" font-size="12" fill="var(--muted)">${+v.toFixed(1)}</text>`}
  const line=pts.map((p,i)=>`${i?'L':'M'}${sx(xs[i]).toFixed(1)},${sy(p.y).toFixed(1)}`).join('');
  const area=line+`L${sx(xs[xs.length-1]).toFixed(1)},${H-B}L${sx(xs[0]).toFixed(1)},${H-B}Z`;
  const last=pts.length-1;
  const lab=(i,anchor)=>`<text x="${sx(xs[i])}" y="${H-10}" text-anchor="${anchor}" font-size="12" fill="var(--muted)">${esc(fmtDate(pts[i].x,{day:'numeric',month:'short'}))}</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfica de evolución">${g}
   ${goal!=null?`<line x1="${L}" x2="${W-R}" y1="${sy(goal)}" y2="${sy(goal)}" stroke="var(--ok)" stroke-width="2" stroke-dasharray="7 6"/><text x="${L+6}" y="${sy(goal)-7}" font-size="12" font-weight="700" fill="var(--ok)">Objetivo ${String(goal).replace('.',',')} ${unit}</text>`:''}
   <path d="${area}" fill="var(--accent)" opacity=".12"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
   ${pts.map((p,i)=>`<circle cx="${sx(xs[i])}" cy="${sy(p.y)}" r="${i===last?6:3.5}" fill="${i===last?'var(--accent)':'var(--surface)'}" stroke="var(--accent)" stroke-width="2"/>`).join('')}
   <text x="${Math.min(sx(xs[last]),W-R)}" y="${sy(pts[last].y)-12}" text-anchor="end" font-size="14" font-weight="700" fill="var(--fg)">${String(pts[last].y).replace('.',',')} ${unit}</text>
   ${lab(0,'start')}${lab(last,'end')}</svg>`;
}
function niceStep(r){const p=Math.pow(10,Math.floor(Math.log10(r||1)));const f=r/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}

    const buf=X.write(wb,{bookType:'xlsx',type:'array'});
    const fname=`${(CFG&&CFG.appName||'Libreta').replace(/[^\wÀ-ÿ -]/g,'').trim()||'Libreta'} ${today()}.xlsx`;
    const dl=window.claude?await window.claude.use('downloads'):null;
    if(!dl){say('Este dispositivo no permite descargar archivos desde aquí. Prueba desde Safari en el iPhone o desde un ordenador.');return}
    await dl.save({filename:fname,data:new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})});
    say('Listo. Busca el archivo «'+fname+'» en Descargas (en el iPhone, en la app Archivos).');
  }catch(e){
    say(e&&e.code==='declined'?'Descarga cancelada.':e&&e.code==='host_unavailable'?'Esta app no puede guardar archivos. Ábrela en Safari o en un ordenador.':'No se pudo preparar el archivo. Revisa la conexión e inténtalo otra vez.');
  }finally{btn.disabled=false;btn.textContent=label}
}

const okImg=u=>typeof u==='string'&&/^data:image\/(jpeg|png|webp);base64,/.test(u);
let boardSeq=0, reopen=null;
function boardBtn(ds,label,primary){const k='board-in-'+(++boardSeq);return `<label class="btn btn-big${primary?' btn-primary':''}" for="${k}" style="cursor:pointer">📷 ${esc(label)}</label><input id="${k}" class="board-in" type="file" accept="image/*" data-date="${esc(ds)}" hidden>`}

async function boardImage(file){
  const bmp=await createImageBitmap(file);const M=1400,k=Math.min(1,M/Math.max(bmp.width,bmp.height));
  const cv=document.createElement('canvas');cv.width=Math.round(bmp.width*k);cv.height=Math.round(bmp.height*k);
  cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);return cv.toDataURL('image/jpeg',.72);
}

async function saveAtt(ds,sh,ex){
  const plan=plansOn(ds)[0],rn=dayTitle(ds)||(plan?planTitle(plan):'Clase de '+(sh==='manana'?'mañana':'tarde'));
  let n=0,ok=true;
  for(const el of document.querySelectorAll('#sheet .att')){
    const cid=el.dataset.cid,on=el.querySelector('[data-act=att-toggle]').getAttribute('aria-pressed')==='true',x=ex.get(cid);
    if(on){n++;const sc=el.querySelector('[data-act=att-score][aria-pressed="true"]');
      const d={...(x||{}),clientId:cid,date:ds,shift:sh,duration:'60',score:sc?+sc.dataset.id:null,notes:el.querySelector('.att-note').value.trim(),
        routineId:x?x.routineId||null:(plan&&plan.routineId)||null,routineName:dayTitle(ds)||(x&&x.routineName)||rn,planId:x&&x.planId||(plan&&plan.id)||null,exercises:x&&x.exercises||[],createdAt:x&&x.createdAt||Date.now(),updatedAt:Date.now()};
      delete d.id;ok=(await save('sessions',x?x.id:uid(),d))&&ok}
    else if(x)ok=(await remove('sessions',x.id))&&ok;
  }
  if(ok){toast(n?`Asistencia guardada: ${n} ${n===1?'persona':'personas'}`:'Asistencia guardada');if(attReturn)attReturn();else{closeSheet();render()}}
}

/* peso: historial con fecha, objetivo y gráfica */
const fmtKg=v=>String(+(+v).toFixed(1)).replace('.',',');
const weightsOf=id=>measuresOf(id).filter(m=>m.weight!=null&&m.weight!=='');
const curWeight=c=>{const w=weightsOf(c.id);return w.length?+w[w.length-1].weight:(c.weight!=null&&c.weight!==''?+c.weight:null)};
async function upsertWeight(cid,date,w){
  const m=S.measures.find(x=>x.clientId===cid&&x.date===date&&x.weight!=null);
  if(m){const d={...m,weight:w};delete d.id;return save('measures',m.id,d)}
  return save('measures',uid(),{clientId:cid,date,weight:w,fat:null,waist:null,notes:'',createdAt:Date.now()});
}
const migrating=new Set();
async function migrateWeights(){
  for(const c of S.clients){
    if(c.weight==null||c.weight===''||isNaN(+c.weight)||migrating.has(c.id)||weightsOf(c.id).length)continue;
    migrating.add(c.id);
    await save('measures','w-'+c.id,{clientId:c.id,date:iso(c.updatedAt||c.createdAt||Date.now()),weight:+c.weight,fat:null,waist:null,notes:'',createdAt:Date.now()});
  }
}
function weightPanel(c){
  const ws_=weightsOf(c.id),cur=curWeight(c),first=ws_[0];
  const diff=first&&ws_.length>1?Math.round((cur-first.weight)*10)/10:null;
  return `<div class="card"><div class="wstat">
     <div><span class="label">Peso actual</span><b class="num">${cur!=null?fmtKg(cur)+' kg':'—'}</b><span class="small muted">${ws_.length?esc(fmtDate(ws_[ws_.length-1].date)):'Sin registros'}</span></div>
     <div><span class="label">Primer registro</span><b class="num">${first?fmtKg(first.weight)+' kg':'—'}</b><span class="small muted">${first?esc(fmtDate(first.date)):''}</span></div></div>
     ${diff!=null?`<p class="small" style="margin-top:8px">Desde el ${esc(fmtDate(first.date))}: <b>${diff<0?'ha bajado '+fmtKg(-diff):diff>0?'ha subido '+fmtKg(diff):'sin cambios,'} ${diff?'kg':''}</b></p>`:''}</div>
   <div class="grid2"><button class="btn btn-primary btn-big" data-act="new-weight" data-id="${esc(c.id)}">${ic('plus')} Nuevo peso</button><button class="btn btn-big" data-act="weight-chart" data-id="${esc(c.id)}">📈 Ver gráfica</button></div>`;
}
function weightForm(cid){
  const c=byId('clients',cid);if(!c)return;const cur=curWeight(c);
  openSheet('Peso de '+c.name.split(' ')[0],`
   ${field('wf-date','Fecha',inp('wf-date',today(),'type="date"'))}

function goalForm(cid){

function weightChart(cid){

   ${pts.length?`<div class="list">${[...weightsOf(cid)].reverse().map((m,i,a)=>{const prev=a[i+1];const d=prev?Math.round((m.weight-prev.weight)*10)/10:null;
     return `<button type="button" class="card" data-act="edit-measure" data-id="${esc(m.id)}"><span class="row between"><b>${esc(fmtDate(m.date))}</b><span class="num"><b>${fmtKg(m.weight)} kg</b>${d?` <span class="small ${d<0?'':'muted'}">(${d>0?'+':'−'}${fmtKg(Math.abs(d))})</span>`:''}</span></span></button>`}).join('')}</div>`:''}`,
  closeSheet,{saveLabel:'Cerrar',info:true});

/* foto del alumno */
async function photoThumb(file){
  const bmp=await createImageBitmap(file);const S2=320,k=Math.max(S2/bmp.width,S2/bmp.height);
  const cv=document.createElement('canvas');cv.width=S2;cv.height=S2;
  const w=bmp.width*k,h=bmp.height*k;cv.getContext('2d').drawImage(bmp,(S2-w)/2,(S2-h)/2,w,h);
  return cv.toDataURL('image/jpeg',.8);
}
async function deleteClient(c){
  for(const x of sessionsOf(c.id))await remove('sessions',x.id);
  for(const m of measuresOf(c.id))await remove('measures',m.id);
  if(await remove('clients',c.id)){closeConfirm();toast(c.name+' eliminado');go('clientes')}
}

function readRows(){return [...document.querySelectorAll('#sheet [data-row]')].map(r=>{const o={};r.querySelectorAll('[data-k]').forEach(i=>o[i.dataset.k]=i.value.trim());if('weight'in o)o.weight=num(o.weight);if(o.kind!=='cardio')o.kind='ex';o.block=+o.block||0;return o}).filter(o=>o.name)}
const addBtns=(mode,target='rows')=>`<div class="grid2"><button type="button" class="btn btn-big" data-act="pick-ex" data-kind="ex" data-mode="${mode}" data-target="${target}">${ic('plus')} Ejercicio</button><button type="button" class="btn btn-big" data-act="pick-ex" data-kind="cardio" data-mode="${mode}" data-target="${target}">${ic('plus')} Cardio</button></div>`;

/* biblioteca de ejercicios */
const CARDIO_DEFAULTS=['Cinta','Bici estática','Elíptica','Remo','Comba'];
function library(kind){
  const m=new Map();
  const add=(n,k)=>{if(!n)return;const key=norm(n);if((k||'ex')===kind&&!m.has(key))m.set(key,n.trim())};
  S.exercises.forEach(e=>add(e.name,e.kind));
  S.routines.forEach(r=>(r.exercises||[]).forEach(e=>add(e.name,e.kind)));
  S.sessions.forEach(x=>(x.exercises||[]).forEach(e=>add(e.name,e.kind)));
  if(kind==='cardio')CARDIO_DEFAULTS.forEach(n=>add(n,'cardio'));
  return [...m.values()].sort((a,b)=>a.localeCompare(b,'es'));
}
async function rememberExercises(list){
  for(const e of list){const k=e.kind==='cardio'?'cardio':'ex';
    if(!S.exercises.some(x=>norm(x.name)===norm(e.name)&&(x.kind||'ex')===k))await save('exercises',uid(),{name:e.name.trim(),kind:k,createdAt:Date.now()})}
}
let pickerCtx=null;
function openPicker(kind,mode,target){

  el.innerHTML=`<div class="sheet-bg" style="z-index:50" data-act="picker-bg"><div class="sheet" style="max-height:88%">
   <header><span style="width:60px"></span><h3>${kind==='cardio'?'Añadir cardio':'Añadir ejercicio'}</h3><button type="button" class="btn btn-ghost" data-act="picker-close">Cerrar</button></header>
   <div class="body"><input id="pk-q" type="search" placeholder="${kind==='cardio'?'Busca o escribe uno nuevo (ej.: Cinta)':'Busca o escribe uno nuevo (ej.: Sentadilla)'}" autocomplete="off">
   <div class="list" id="pk-list"></div></div></div></div>`;

function drawPicker(){
  const q=(document.getElementById('pk-q')?.value||'').trim();
  const lib=library(pickerCtx.kind);

  const exact=lib.some(n=>norm(n)===norm(q));
  let h='';
  if(q&&!exact)h+=`<button type="button" class="btn btn-primary btn-big" data-act="pk-new">${ic('plus')} Crear «${esc(q)}»</button>`;
  h+=list.map(n=>`<button type="button" class="card" data-act="pk-add" data-name="${esc(n)}" style="min-height:58px;justify-content:center"><b>${esc(n)}</b></button>`).join('');

  else if(!list.length&&q)h+='';

}
function closePicker(){document.getElementById('picker').innerHTML='';pickerCtx=null}
async function pickerAdd(name,isNew){
  const {kind,mode,target}=pickerCtx;

/* rutina */
let rDraft=null;
function blkHtml(bl){

    <div class="row between"><b>${bl.length>1?'Parte '+(i+1):'Tipo de entrenamiento'}</b>${i>0?`<button type="button" class="btn btn-ghost" data-act="blk-rm" data-id="${i}" style="color:var(--danger)" aria-label="Quitar este tipo">${ic('close')}</button>`:''}</div>
    <select data-b="type" aria-label="Tipo"><option value="">— Elige el tipo —</option>${T.map(t=>`<option ${t===b.type?'selected':''}>${esc(t)}</option>`).join('')}<option value="__new" ${custom||b.type==='__new'?'selected':''}>Otro (escribir)…</option></select>
    ${custom||b.type==='__new'?`<input data-b="custom" value="${esc(custom?b.type:'')}" placeholder="Escribe el tipo, ej.: Chipper" autocomplete="off" enterkeyhint="done">`:''}
    <label class="field"><span class="small muted">Minutos (opcional)</span><input data-b="mins" value="${esc(b.mins)}" inputmode="numeric" placeholder="Ej.: 12"></label></div>`}).join('');

function addTypes(list){const nuevos=[...new Set(list.map(t=>t.trim()).filter(t=>t&&t!=='__new'&&!TYPES_().includes(t)))];if(!nuevos.length)return;const ct=[...((CFG&&CFG.customTypes)||[]),...nuevos];CFG={...(CFG||{}),customTypes:ct};save('settings','main',CFG)}
function readBlks(){return [...document.querySelectorAll('#sheet [data-blk]')].map(el=>{const t=el.querySelector('[data-b=type]').value;const c=el.querySelector('[data-b=custom]');return {type:t==='__new'?(c?c.value.trim():'__new')||'__new':t,mins:el.querySelector('[data-b=mins]').value.trim()}})}
function drawBlks(bl){
  document.getElementById('blk-list').innerHTML=blkHtml(bl);

function routineStart(draft){

  openSheet(rDraft.isNew?'Rutina nueva':'Nombre y tipos',`

     <div class="stack" id="rows-${i}" data-rows="${i}">${rowsBlock(ex.filter(e=>Math.min(+e.block||0,bl.length-1)===i),'routine')}</div>

function pickCount(){const n=document.querySelectorAll('.pickp[aria-pressed="true"]').length;const b=document.getElementById('pick-go');if(b)b.textContent=n?`Siguiente (${n} ${n===1?'persona':'personas'})`:'Siguiente'}

function sessionForm(clientId,s,pre={}){

  },s?{del:{label:'Borrar este entrenamiento',run:async()=>{if(await remove('sessions',s.id)){closeSheet();toast('Entrenamiento borrado')}}}}:{});

function prefill(clientId,routineId){
  const rt=byId('routines',routineId);

  if(rt){const lastEx=new Map((last?.exercises||[]).map(e=>[norm(e.name),e]));
    return (rt.exercises||[]).map(e=>{const l=lastEx.get(norm(e.name));return {name:e.name,kind:e.kind,sets:l?.sets||e.sets,reps:l?.reps||e.reps,mins:l?.mins||e.mins,intensity:l?.intensity||e.intensity,weight:l?.weight??''}})}
  return last?(last.exercises||[]).map(e=>({...e})):[];
}

/* ---------- eventos ---------- */
let toastT;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}

document.addEventListener('click',async e=>{
  const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return}
  const tb=e.target.closest('[data-tab]');if(tb){clientTab=tb.dataset.tab;render();return}
  const rp=e.target.closest('[data-rpe]');if(rp){const on=rp.getAttribute('aria-pressed')==='true';rp.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed','false'));rp.setAttribute('aria-pressed',String(!on));return}
  const a=e.target.closest('[data-act]');if(!a)return;
  const act=a.dataset.act,id=a.dataset.id;
  if((act==='close-bg'||act==='picker-bg'||(act==='confirm-no'&&a.classList.contains('sheet-bg')))&&e.target!==a)return;
  if(act.startsWith('w-')){wizRead();const d=wiz.d;
    if(act==='w-next'){await wizNext();return}
    if(act==='w-back')wiz.step--;
    if(act==='w-cancel'){wiz=null;render();return}
    if(act==='w-word')d.wordP=id||'';
    if(act==='w-type')d.types=d.types.includes(id)?d.types.filter(x=>x!==id):[...d.types,id];
    if(act==='w-addtype'){const v=(document.getElementById('w-newtype').value||'').trim();if(v&&!d.types.includes(v))d.types.push(v)}
    if(act==='w-sample'){d.sample=id==='1';document.querySelectorAll('[data-act=w-sample]').forEach(b=>b.disabled=true);a.textContent=d.sample?'Creando rutinas…':'Un momento…';await wizNext();if(wiz)render();return}
    render();if(act==='w-word'&&!id){const el=document.getElementById('w-wordp');el&&el.focus()}return}
  if(act==='settings'){openSettings();return}
  if(act==='edit-names'){closeSheet();wiz={step:0,edit:true,d:{trainerName:CFG?.trainerName||'',appName:CFG?.appName||'',wordP:WP(),types:[...(CFG?.types||DEFAULT_TYPES)],sample:false}};render();window.scrollTo(0,0);return}
  if(readOnly&&/^(new|edit|pick-session|plan-done|log-day)/.test(act)){toast('Solo puedes ver los datos');return}
  switch(act){
    case 'close':case 'close-bg':closeSheet();break;
    case 'new-client':clientForm();break;
    case 'edit-client':clientForm(byId('clients',id));break;
    case 'new-routine':routineStart();break;
    case 'edit-routine':editRoutine(byId('routines',id));break;
    case 'r-step1':{rDraft.exercises=readRows();rDraft.description=fv('r-desc');closeSheet();routineStart(rDraft);break}
    case 'blk-add':{const bl=readBlks();bl.push({type:'',mins:''});drawBlks(bl);break}
    case 'blk-rm':{const bl=readBlks();bl.splice(+id,1);drawBlks(bl);break}
    case 'dup-routine':{const r=byId('routines',id);const nid=uid();if(await save('routines',nid,{...r,id:undefined,name:r.name+' (copia)',createdAt:Date.now()})){closeSheet();toast('Rutina duplicada');editRoutine(byId('routines',nid)||{...r,id:nid,name:r.name+' (copia)'})}break}
    case 'new-session':trainingDay(today());break;
    case 'edit-session':{const s=byId('sessions',id);if(!s)break;if(s.shift){attReturn=null;attForm(s.date,s.shift)}else sessionForm(s.clientId,s);break}
    case 'pick-session':trainingDay(today());break;
    case 'toggle-pick':{const on=a.getAttribute('aria-pressed')!=='true';a.setAttribute('aria-pressed',String(on));a.querySelector('.tick').textContent=on?'✓':'';pickCount();break}
    case 'pick-go':pickGo();break;
    case 'cfilter':cFilter=id;render();break;
    case 'export-xlsx':exportXlsx(a);break;
    case 'board-view':viewBoard(id);break;
    case 'board-del':{const b=byId('boards',id);if(b)askConfirm('¿Borrar esta foto?','Se borrará la foto de la pizarra de este día. No se puede deshacer.','Sí, eliminar',async()=>{if(await remove('boards',id)){closeConfirm();toast('Foto borrada');if(reopen)reopen();else render()}});break}
    case 'del-client':{const c=byId('clients',id);if(c)askConfirm('¿Eliminar a '+c.name+'?','¿Seguro que quieres eliminar a '+c.name+'? Se borrarán también todos sus entrenamientos y medidas. No se puede deshacer.','Sí, eliminar',()=>deleteClient(c));break}
    case 'confirm-yes':{a.disabled=true;a.textContent='Eliminando…';confirmFn&&await confirmFn();break}
    case 'confirm-no':closeConfirm();break;
    case 'p-group':{document.getElementById('p-group').value=id;a.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===a)));break}
    case 'pfilter':{a.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===a)));document.querySelectorAll('.pickp').forEach(b=>{b.hidden=!!id&&b.dataset.shift!==id&&b.dataset.shift!=='ambos'});break}
    case 'f-days':{const on=a.getAttribute('aria-pressed')!=='true';document.querySelectorAll('#days-btns button').forEach(b=>{const m=on&&b===a;b.setAttribute('aria-pressed',String(m));b.classList.toggle('btn-primary',m)});break}
    case 'f-shift':{const on=a.getAttribute('aria-pressed')!=='true';a.setAttribute('aria-pressed',String(on));a.classList.toggle('btn-primary',on);break}
    case 'open-day':openDay(id);break;
    case 'new-plan':planForm(id);break;
    case 'open-plan':{const p=byId('plans',id);if(p)planForm(p.date,p);break}
    case 'plan-done':{const p=byId('plans',id);closeSheet();trainingDay(p.date);break}
    case 'log-day':trainingDay(id);break;
    case 'training-day':trainingDay(id);break;
    case 'att-menu':attMenu(id);break;
    case 'att-shift':{const [d,sh]=id.split('|');attReturn=()=>attMenu(d);attForm(d,sh);break}
    case 'att-home':attReturn=null;attForm(today(),id);break;
    case 'new-day':newDayForm(today());break;
    case 'day-name':dayNameForm(id);break;
    case 'att-toggle':{const on=a.getAttribute('aria-pressed')!=='true';a.setAttribute('aria-pressed',String(on));a.querySelector('.tick').textContent=on?'✓':'';const m=a.parentElement.querySelector('.att-more');if(m)m.hidden=!on;break}
    case 'att-score':{const on=a.getAttribute('aria-pressed')!=='true';a.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(on&&b===a)));break}
    case 'new-weight':weightForm(id);break;
    case 'weight-chart':weightChart(id);break;
    case 'cal-prev':calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()-1,1);render();break;
    case 'cal-next':calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()+1,1);render();break;
    case 'cal-today':{const d=new Date();calMonth=new Date(d.getFullYear(),d.getMonth(),1);render();break}
    case 'new-measure':measureForm(id);break;
    case 'edit-measure':{const m=byId('measures',id);measureForm(m.clientId,m);break}
    case 'pick-ex':openPicker(a.dataset.kind,a.dataset.mode,a.dataset.target);break;
    case 'pk-add':pickerAdd(a.dataset.name,false);break;
    case 'pk-new':{const q=document.getElementById('pk-q').value.trim();if(q)pickerAdd(q.charAt(0).toUpperCase()+q.slice(1),true);break}
    case 'picker-close':closePicker();break;
    case 'picker-bg':if(e.target===a)closePicker();break;
    case 'rm-row':{const rows=a.closest('[data-rows]');a.closest('[data-row]').remove();if(rows&&!rows.querySelector('[data-row]'))rows.innerHTML=emptyRows;break}
    case 'del':if(!a.classList.contains('armed')){a.classList.add('armed');a.dataset.orig=a.textContent;a.textContent='Pulsa otra vez para confirmar';setTimeout(()=>{if(a.isConnected){a.classList.remove('armed');a.textContent=a.dataset.orig}},4000)}else if(sheetDel){a.disabled=true;await sheetDel.run()}break;
  }
});
document.addEventListener('submit',e=>{if(e.target.id==='sheetform'){e.preventDefault();sheetSubmit&&sheetSubmit()}});
document.addEventListener('input',e=>{if(e.target.id==='pk-q'){drawPicker();return}
  if(e.target.id==='q'){search=e.target.value;const l=document.getElementById('clist');const list=clientsFiltered();l.innerHTML=list.length?list.map(clientCard).join(''):'<div class="empty">Nadie con ese nombre.</div>'}
});
document.addEventListener('change',async e=>{
  if(e.target.id==='nd-photo'){newDayPick(e.target);return}
  if(e.target.classList&&e.target.classList.contains('board-in')){addBoard(e.target);return}
  if(e.target.id==='f-photo-in'||e.target.id==='prof-photo'){const f=e.target.files&&e.target.files[0];if(!f)return;
    let url;try{url=await photoThumb(f)}catch(err){toast('No se pudo abrir la foto');return}
    if(e.target.id==='f-photo-in'){document.getElementById('f-photo').value=url;document.getElementById('f-photo-prev').innerHTML=avatar({name:fv('f-name')||'?',photo:url},72);e.target.previousElementSibling&&0}
    else{const c=byId('clients',e.target.dataset.id);if(c){const d={...c};delete d.id;d.photo=url;if(await save('clients',c.id,d))toast('Foto guardada')}}
    e.target.value='';return}if(e.target.matches&&e.target.matches('[data-blk] [data-b=custom]')){const v=e.target.value.trim();if(v){addTypes([v]);drawBlks(readBlks());toast('Tipo «'+v+'» añadido a tu lista')}return}if(e.target.matches&&e.target.matches('[data-blk] select')){drawBlks(readBlks());if(e.target.value==='__new'){const i=[...document.querySelectorAll('#sheet [data-blk]')].findIndex(x=>x.contains(e.target));}const c=document.querySelector('#sheet [data-b=custom]');if(e.target.value==='__new'&&c)c.focus();return}if(e.target.id==='photo-in'){readBoard(e.target);return}if(e.target.id==='progsel'){progEx=e.target.value;drawProgress(route().id)}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='pk-q'){e.preventDefault();const b=document.querySelector('[data-act="pk-new"]')||document.querySelector('[data-act="pk-add"]');b&&b.click();return}if(e.key==='Escape'&&pickerCtx){closePicker();return}if(e.key==='Enter'&&wiz&&e.target.tagName==='INPUT'){e.preventDefault();if(e.target.id==='w-newtype')document.querySelector('[data-act="w-addtype"]').click();else wizNext();return}if(e.key==='Escape'&&sheetSubmit)closeSheet()});

init();
</script>
